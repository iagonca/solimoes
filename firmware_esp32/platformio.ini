; Projeto Solimões - nó embarcado (versão Wi-Fi)
; Abra esta pasta no VS Code com a extensão PlatformIO e clique em "Upload".

[env:esp32dev]
platform = espressif32
board = esp32dev            ; troque por heltec_wifi_lora_32_V3 se usar a Heltec
framework = arduino
monitor_speed = 115200
upload_speed = 115200       ; mais lento, mas estável em placas com CH340
lib_deps =
    robtillaart/INA226@^0.6.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit SHT31 Library@^2.2.2
    bblanchon/ArduinoJson@^7.0.4
